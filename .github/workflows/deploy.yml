name: Deploy Theopack → Hostinger

on:
  push:
    branches:
      - theopack-site   # dispara automaticamente a cada push na branch principal

jobs:
  deploy:
    name: Upload para Hostinger via SFTP
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Baixar código do repositório
        uses: actions/checkout@v4

      - name: 🚀 Enviar arquivos para Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:   srv816-files.hstgr.io
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftps
          port:     21
          local-dir:  ./          # pasta raiz do repositório
          server-dir: /public_html/wp-content/themes/twentytwentyfive/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            README.md
